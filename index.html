<!DOCTYPE html>
<html>
<head>
  <!--
    Base href harus disesuaikan dengan nama repo di GitHub Pages.
    Karena repo kamu bernama "PTIMM_APP1", maka base href = /PTIMM_APP1/
  -->
  <base href="/PTIMM_APP1/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ptimm_app1">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ptimm_app1</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Tambahan untuk PDF.js (sesuai kebutuhan project kamu) -->
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
    var { pdfjsLib } = globalThis;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';
    var pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
      cMapPacked: true,
    }
  </script>

  <!-- Disable service worker biar gak blank page di GitHub Pages -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>

  <!-- Flutter app -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
